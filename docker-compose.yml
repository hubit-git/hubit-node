services:
  hubit-node:
    # the image is built by the GitHub Action of this repository; `docker compose up -d --build` builds it here instead
    image: ${HUBIT_NODE_IMAGE:-ghcr.io/hubit-git/hubit-node:latest}
    build: .
    container_name: hubit-node
    network_mode: host
    restart: unless-stopped
    pids_limit: -1  # no cap on processes: systemd gives a container a default cap (about 4500 on a small server) that busy nodes reach
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE  # lets `ss -p` see which process owns a connection (the online list)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
