services:
  hubit-node:
    build: .
    image: hubit-node:local
    container_name: hubit-node
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE  # lets `ss -p` see which process owns a connection (the online list)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
